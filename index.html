<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armando Barber Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #D4AF37;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2b2b2b;
            color: #fff;
            box-sizing: border-box;
        }
        .cards-container {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .card {
            flex: 1;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            background: #2b2b2b;
        }
        .card.active {
            border-color: #D4AF37;
            background: #3a3a3a;
        }
        .card img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 5px;
        }
        button {
            background: #D4AF37;
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #c29f31;
        }
        #confirmacao {
            margin-top: 15px;
            padding: 10px;
            background: #2e7d32;
            color: white;
            text-align: center;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Armando Barber Shop</h2>
    
    <form id="formReserva" onsubmit="event.preventDefault();">
        <label>Barbeiro</label>
        <div class="cards-container">
            <div class="card active" onclick="selecionarBarbeiro('David',this)">
                <img src="https://i.imgur.com/QYKPKZ2.jpg">
                <span>David</span>
            </div>
            <div class="card" onclick="selecionarBarbeiro('Armando',this)">
                <img src="https://i.imgur.com/JVUmj2q.jpg">
                <span>Armando</span>
            </div>
        </div>

        <input type="hidden" id="barbeiro" value="David">

        <label>Serviço</label>
        <select id="servico">
            <option value="Corte">Corte - R$40</option>
            <option value="Barba">Barba - R$30</option>
            <option value="Sobrancelha">Sobrancelha - R$10</option>
            <option value="Corte e Barba">Corte e Barba - R$70</option>
        </select>

        <label>📅 Data</label>
        <input type="date" id="data" required>

        <label>👤 Nome</label>
        <input type="text" id="nome" placeholder="Seu nome" required>

        <label>📱 WhatsApp</label>
        <input type="tel" inputmode="numeric" id="telefone" placeholder="Ex: 4734354016" required>

        <label>⏰ Hora</label>
        <select id="hora"></select>

        <button type="button" id="btnAgendar" onclick="agendar()">Agendar ✅</button>
        <button type="button" onclick="abrirMaps()">📍 Ver localização</button>
        <button id="btnInstalar" style="display:none; width:100%; margin-top:12px; padding:15px; background:#D4AF37; color:#000; border:none; border-radius:12px; font-weight:bold; font-size:16px;">📱 Baixar APP - Armando Barber</button>
    </form>

    <div id="confirmacao" style="display:none;">
        Reserva enviada com sucesso! Obrigado por nos preferir.
    </div>
</div>

<script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('btnInstalar').style.display = 'block';
});

document.getElementById('btnInstalar').addEventListener('click', async () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            document.getElementById('btnInstalar').style.display = 'none';
        }
        deferredPrompt = null;
    }
});
</script>

<script>
(function(){
    "use strict";

    /* CONFIG */
    const API_URL = "https://script.google.com/macros/s/AKfycbxJtqFT6tj3A6ekl2PHhXgF0j-5FJbj-EJT1I9Tn884kFgd7t_9pY9qT8pbK3T-xbXU/exec";

    // LIMPIAR CAMPOS CUANDO EL USUARIO REGRESA DESDE WHATSAPP
    window.addEventListener("pageshow", function(){
        document.getElementById("nome").value = "";
        document.getElementById("telefone").value = "";
        document.getElementById("servico").selectedIndex = 0;
        document.getElementById("hora").selectedIndex = 0;
    });

    /* FECHA MINIMA */
    window.addEventListener("load", function(){
        var agora = new Date();
        var hoy = agora.getFullYear() + "-" +
                  String(agora.getMonth() + 1).padStart(2,'0') + "-" +
                  String(agora.getDate()).padStart(2,'0');
        document.getElementById("data").min = hoy;
    });

    /* HORAS */
    var HORAS_SEMANA = [
        "08:30","09:00","09:30",
        "10:00","10:30","11:00",
        "13:00","13:30","14:00",
        "14:30","15:00","15:30",
        "16:00","16:30","17:00",
        "17:30","18:00","18:30",
        "19:00","19:30","20:00"
    ];

    var HORAS_SABADO = [
        "08:00","08:30",
        "09:00","09:30",
        "10:00","10:30",
        "11:00","11:30",
        "13:00","13:30",
        "14:00","14:30",
        "15:00","15:30",
        "16:00","16:30",
        "17:00","17:30"
    ];

    /* SELECCIONAR BARBERO */
    window.selecionarBarbeiro = function(nome, el){
        document.getElementById("barbeiro").value = nome.trim();
        var cards = document.querySelectorAll(".card");
        for(var i=0;i<cards.length;i++){
            cards[i].classList.remove("active");
        }
        el.classList.add("active");
        carregarHoras();
    };

    /* CARGAR HORAS */
    async function carregarHoras(){
        if(window.carregandoHoras) return;
        window.carregandoHoras = true;

        var data = document.getElementById("data").value;
        var barbeiro = document.getElementById("barbeiro").value.trim();
        var select = document.getElementById("hora");

        select.innerHTML = "";
        var loadingOption = document.createElement("option");
        loadingOption.value = "";
        loadingOption.text = "Carregando horas...";
        loadingOption.disabled = true;
        loadingOption.selected = true;
        select.add(loadingOption);

        if(!data || !barbeiro){
            window.carregandoHoras = false;
            return;
        }

        var partes = data.split("-");
        var dataSelecionada = new Date(
            parseInt(partes[0]),
            parseInt(partes[1]) - 1,
            parseInt(partes[2])
        );
        var diaSemana = dataSelecionada.getDay();
        var HORAS;

        if(diaSemana === 0){
            select.innerHTML = "";
            var opt = document.createElement("option");
            opt.value = "";
            opt.text = "Fechado aos domingos";
            opt.disabled = true;
            opt.selected = true;
            select.add(opt);
            window.carregandoHoras = false;
            return;
        }

        if(diaSemana === 6){
            HORAS = HORAS_SABADO;
        }else{
            HORAS = HORAS_SEMANA;
        }

        var ocupados = [];
        try{
            var res = await fetch(API_URL + "?callback=dummy");
            var datos = await res.json();

            for(var i = 0; i < datos.length; i++){
                if(!datos[i]) continue;
                var d = String(datos[i].data || "").trim().toUpperCase();
                var h = String(datos[i].hora || "").trim();
                var b = String(datos[i].barbero || "").trim();

                if(!d || !h || !b) continue;

                if((d === data || d === "TODOS") && b === barbeiro){
                    var status = "";
                    if(datos[i].status){
                        status = String(datos[i].status).trim().toLowerCase();
                    }
                    if(status.includes("cancelado")){
                        continue;
                    }
                    ocupados.push(h);
                }
            }
        }catch(e){
            console.log("Erro API", e);
        }

        var ahora = new Date();
        var hoy = ahora.getFullYear() + "-" +
                  String(ahora.getMonth() + 1).padStart(2,'0') + "-" +
                  String(ahora.getDate()).padStart(2,'0');
        var horaActual = String(ahora.getHours()).padStart(2,'0') + ":" +
                         String(ahora.getMinutes()).padStart(2,'0');

        select.innerHTML = "";
        for(var i=0;i<HORAS.length;i++){
            var h = HORAS[i];
            var opt = document.createElement("option");
            opt.value = h;
            opt.text = h;

            if(ocupados.indexOf(h) !== -1){
                opt.disabled = true;
                opt.text = h + " (ocupado)";
            }
            if(data === hoy && h <= horaActual){
                opt.disabled = true;
                opt.text = h + " (passou)";
            }
            select.add(opt);
        }

        var disponibles = 0;
        for(var i = 0; i < select.options.length; i++){
            if(!select.options[i].disabled){
                disponibles++;
            }
        }

        if(disponibles === 0){
            select.innerHTML = "";
            var opt = document.createElement("option");
            opt.value = "";
            opt.text = "Sem horários disponíveis — escolha outra data";
            opt.disabled = true;
            opt.selected = true;
            select.add(opt);
        }

        window.carregandoHoras = false;
    }

    /* EVENTO FECHA */
    document.addEventListener("DOMContentLoaded", function(){
        setTimeout(carregarHoras, 100);
        document.getElementById("data").addEventListener("change", carregarHoras);
    });

    /* AGENDAR (PARCHE APLICADO AQUÍ) */
    window.agendar = function(){
        var data = document.getElementById("data").value;
        var hora = document.getElementById("hora").value;
        var nome = document.getElementById("nome").value;
        
        // Extracción correcta del valor del teléfono
        var telefonoInput = document.getElementById("telefone");
        var telefono = telefonoInput ? telefonoInput.value : "";
        
        var barbeiro = document.getElementById("barbeiro").value.trim();
        var servico = document.getElementById("servico").value;

        if(!data || !hora || !nome || !telefono){
            alert("Preencha todos os campos");
            return;
        }

        var texto =
            "Olá Armando Barber Shop%0A%0A" +
            "Quero agendar um horário%0A%0A" +
            "Barbeiro: " + barbeiro + "%0A" +
            "Serviço: " + servico + "%0A" +
            "Data: " + data + "%0A" +
            "Hora: " + hora + "%0A" +
            "Nome: " + nome;

        window.open("https://wa.me/554734354016?text=" + texto);

        fetch(API_URL,{
            method: "POST",
            body: new URLSearchParams({
                data: data,
                hora: hora,
                cliente: nome,
                telefone: telefono,
                servico: servico,
                barbeiro: barbeiro
            })
        })
        .then(response => response.text())
        .then(() => {
            localStorage.setItem("ultima_reserva", "ok");

            let msg = document.getElementById("confirmacao");
            if(msg){
                msg.style.display = "block";
                msg.innerHTML = "Reserva enviada com sucesso! Obrigado por nos preferir.";
            }

            document.getElementById("nome").value = "";
            document.getElementById("telefone").value = "";
            document.getElementById("servico").selectedIndex = 0;
            document.getElementById("hora").selectedIndex = 0;

            setTimeout(() => {
                carregarHoras();
            }, 1500);
        })
        .catch(() => {
            alert("Erro ao salvar reserva");
        });
    };

    /* MAPS */
    window.abrirMaps = function(){
        window.open("https://maps.app.goo.gl/PeCnFTVfxGxvAyP48");
    };

})();

window.addEventListener("load", function(){
    let msg = document.getElementById("confirmacao");
    if(msg){
        msg.style.display = "none";
    }
    localStorage.removeItem("ultima_reserva");
});
</script>

</body>
</html>
