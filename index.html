<script>
// ARMANDO - FIX: Abre WhatsApp DE UNA (sin preguntar) y guarda en segundo plano
(function(){
  const API = "https://script.google.com/macros/s/AKfycbztv0Kjze9NPhvUBXgkD0ROj_kvRZOrOq2a9hNkn4tzVIPQ0LB3oT3wFSycJTRRGucn/exec";
  const originalOpen = window.open;
  
  window.open = function(url, ...rest){
    try {
      if (url && url.includes("wa.me")) {
        // 1. ABRIR WHATSAPP INMEDIATAMENTE - conserva el gesto del usuario, no pregunta
        const result = originalOpen.call(window, url, ...rest);
        
        // 2. GUARDAR EN SHEET EN SEGUNDO PLANO (después de abrir)
        try {
          const urlObj = new URL(url);
          const text = decodeURIComponent(urlObj.searchParams.get("text") || "");
          let cliente = (text.match(/Cliente:\s*([^\n]+)/i) || [])[1] || "";
          let telefone = (text.match(/Tel:\s*([^\n]+)/i) || [])[1] || "";
          let barbeiro = (text.match(/Barbeiro:\s*([^\n]+)/i) || [])[1] || "David";
          let servico = (text.match(/Serviço:\s*([^\n(]+)/i) || [])[1] || "Barba";
          let dataMatch = text.match(/(\d{2}\/\d{2}\/\d{4})/);
          let dataBR = dataMatch ? dataMatch[0] : "";
          let horasMatch = text.match(/(\d{2}:\d{2})/g) || [];
          
          let dataISO = "";
          if (dataBR) { const [d,m,a] = dataBR.split("/"); dataISO = `${a}-${m}-${d}`; }
          
          if (dataISO && horasMatch.length > 0) {
            let horasReales = horasMatch.slice(-4).slice(0,3); // ultimas horas reales
            horasReales.forEach(h => {
              let barbs = [];
              if (text.includes("David") && text.includes("Armando")) barbs = ["David","Armando"];
              else if (text.includes("David")) barbs = ["David"];
              else if (text.includes("Armando")) barbs = ["Armando"];
              else barbs = [barbeiro];
              
              barbs.forEach(b => {
                const params = new URLSearchParams({data: dataISO, hora: h, cliente: cliente.trim(), telefone: telefone.trim(), servico: servico.trim(), barbero: b.trim()});
                // Fire and forget - no espera
                fetch(API, {method: 'POST', mode: 'no-cors', body: params}).catch(()=>{});
                // Backup por GET por si POST falla
                fetch(`${API}?${params.toString()}`, {mode: 'no-cors'}).catch(()=>{});
              });
            });
          }
        } catch(e){}
        
        return result; // devuelve inmediatamente, no pregunta
      }
    } catch(e){}
    return originalOpen.call(window, url, ...rest);
  };
})();
</script>
